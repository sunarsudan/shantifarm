<!DOCTYPE html>
<html>
<head>
	 <script src="https://cdn.tailwindcss.com"></script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body>
<!-- HERO SECTION -->
<section class="relative h-[400px] bg-[url('images/home2.jpg')] bg-cover bg-center flex items-center bg-fixed">

  <!-- Dark overlay -->
  <div class="absolute inset-0 bg-black/30"></div>

  <!-- Small Contact Box -->
  <div class="relative z-10 ml-10 md:ml-20">
    
    <div class="bg-green-600 text-white px-8 py-6 rounded-lg shadow-xl w-fit mt-60">
      <h2 class="text-2xl md:text-3xl font-bold">Contact Us</h2>
      <p class="text-sm md:text-base mt-2">
        We would love to hear from you.
      </p>
    </div>

  </div>
</section>
<section class="bg-gray-100 py-16 px-6 md:px-20">

  <div class="grid md:grid-cols-2 gap-12 items-center">

    <!-- Contact Info Card -->
    <div class="bg-white p-8 rounded-2xl shadow-lg">
      <h3 class="text-2xl font-bold mb-6">Let's Start Talk</h3>

      <div class="space-y-4 text-gray-600">
        <p><strong>📍 Location:</strong> Kathmandu, Nepal</p>
        <p><strong>📧 Email:</strong> info@manashantifarm.com</p>
        <p><strong>📞 Call Us:</strong> +977-98XXXXXXXX</p>
      </div>
    </div>

    <!-- Google Map -->
    <div class="h-[350px] rounded-xl overflow-hidden shadow-lg">
      <iframe 
        src="YOUR_GOOGLE_MAP_LINK"
        class="w-full h-full border-0"
        loading="lazy">
      </iframe>
    </div>

  </div>

</section>
<!-- MESSAGE SECTION -->
<section class="relative py-20 bg-[url('images/farm2.jpg')] bg-cover bg-center">

  <!-- Overlay -->
  <div class="absolute inset-0 bg-green-900/70"></div>

  <div class="relative z-10 text-center text-white mb-10">
    <h2 class="text-3xl md:text-4xl font-bold">Send Us a Message</h2>
    <p class="mt-3">We will respond as soon as possible.</p>
  </div>

  <!-- Form Card -->
  <div class="relative z-10 max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-2xl">
    
    <form class="grid md:grid-cols-2 gap-4">
      
      <input type="text" placeholder="Name"
        class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400">

      <input type="email" placeholder="Email"
        class="p-3 border rounded-lg focus:ring-2 focus:ring-green-400">

      <input type="text" placeholder="Subject"
        class="md:col-span-2 p-3 border rounded-lg focus:ring-2 focus:ring-green-400">

      <textarea placeholder="Message"
        class="md:col-span-2 p-3 border rounded-lg h-32 focus:ring-2 focus:ring-green-400"></textarea>

      <button class="md:col-span-2 bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition">
        Send Message
      </button>

    </form>

  </div>

</section>
</body>
</html>
